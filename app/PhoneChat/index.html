<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="referrer" content="no-referrer" />
        <meta name="robots" content="noindex" />
        <title>SPTV Chat</title>
        <link rel="stylesheet" href="phonechat.css" />
        <!-- jsstart this is here so release_maker can work don't remove-->
        <script src="../thirdparty/irc-message.js"></script>
        <script src="../general/PhoneChatConfig.js"></script>
        <script src="emotes.js"></script>
        <script src="transport.js"></script>
        <script src="auth.js"></script>
        <script src="render.js"></script>
        <script src="local.js"></script>
        <script src="device.js"></script>
        <script src="main.js"></script>
        <!-- this is here so release_maker can work don't remove jsend-->
    </head>

    <body>
        <div id="pc-app">
            <header id="pc-header">
                <div id="pc-header-text">
                    <div id="pc-channel-name">SPTV Chat</div>
                    <div id="pc-connection" aria-live="polite"></div>
                </div>
                <button type="button" id="pc-account-button" class="pc-button" hidden></button>
            </header>

            <div id="pc-banner" class="pc-banner" aria-live="polite" hidden>
                <div id="pc-banner-text"></div>
                <button type="button" id="pc-banner-action" class="pc-button" hidden></button>
            </div>

            <section id="pc-device-login" aria-label="Sign in to Twitch" hidden>
                <h1>Sign in to Twitch</h1>
                <p>Authorize in the Twitch tab, then return here. Chat connects automatically.</p>
                <p>Your sign-in code: <strong id="pc-device-code"></strong></p>
                <a id="pc-device-link" class="pc-button pc-primary" target="_blank" rel="noopener noreferrer">Open Twitch</a>
                <button id="pc-device-cancel" class="pc-button" type="button">Cancel</button>
            </section>

            <div id="pc-chat-tabs" role="tablist" aria-label="Chat filter">
                <button type="button" id="pc-chat-all" class="pc-chat-tab" role="tab" aria-controls="pc-messages" aria-selected="true">
                    All chat
                </button>
                <button
                    type="button"
                    id="pc-chat-priority"
                    class="pc-chat-tab"
                    role="tab"
                    aria-controls="pc-messages"
                    aria-selected="false"
                    tabindex="-1"
                >
                    Partners, VIPs &amp; Mods
                </button>
            </div>
            <p id="pc-chat-empty" role="status" hidden>No Partner, VIP or moderator messages in recent chat. Known bots are excluded.</p>
            <main id="pc-messages" role="tabpanel" aria-labelledby="pc-chat-all" tabindex="0"></main>

            <button type="button" id="pc-jump-latest" class="pc-button" hidden>Jump to latest</button>

            <section id="pc-picker" aria-label="Emote picker" hidden>
                <div id="pc-picker-head">
                    <input type="text" id="pc-picker-search" placeholder="Search emotes" autocomplete="off" />
                    <button type="button" id="pc-picker-close" class="pc-button" aria-label="Close emote picker">Close</button>
                </div>
                <div id="pc-picker-tabs" role="tablist"></div>
                <div id="pc-picker-status"></div>
                <div id="pc-picker-grid"></div>
            </section>

            <footer id="pc-composer">
                <button type="button" id="pc-emote-button" class="pc-button" aria-label="Emotes" hidden>&#9786;</button>
                <input type="text" id="pc-input" placeholder="Send a message" maxlength="480" autocomplete="off" />
                <button type="button" id="pc-send" class="pc-button" hidden>Send</button>
            </footer>
        </div>
    </body>
</html>
